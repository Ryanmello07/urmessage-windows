# THROWAWAY, NEVER MERGE, NEVER IN AN UPSTREAM PULL REQUEST. fix/s3-relay-drawer-trim: the status
# strip with a THREE-COUNTRY EXIT'S LABEL in its server field, at every width from the window's
# 400 DIP minimum up, in Normal mode and in Advanced Mode.
#
# A CI STAND-IN. This runner has no URnetwork route: its route is direct and the field says
# "direct", which never outgrows the strip. So this build's RouteLabel (Live/LiveMesh.cpp) returns,
# for the direct route, the label a route through exits in three countries gets:
# "URnetwork exit \u00B7 United States, Germany, Netherlands". That is the label S3 was reported with, two
# countries longer, a length at which the fit must cut the value itself. Nothing else is changed.
#
# The s3exit leg of .github/task58/drive.ps1, on the fix's head, twice:
#   as-built   the stand-in only: the driver must pass every check.
#   control    the stand-in, and the fit removed from the view as in s3-shots.yml. It is green
#              only when the driver FAILED on the checks that see the defect.
# The window is read with UI Automation and resized with its TransformPattern, and captured with
# PrintWindow. Nothing is published.
name: S3 exit-label screenshots (throwaway)

on:
  push:
    branches:
      - 'ci/s3-exit-shots**'

permissions:
  contents: read

env:
  S3_HEAD: a832482921d77c0026275d8d15824decb923bf2e

jobs:
  shots:
    name: S3 strip with an exit label (${{ matrix.variant }})
    runs-on: windows-2022
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        variant: [as-built, control]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove the checkout is the S3 head plus CI files only
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          $parent = git rev-parse HEAD^
          Write-Host "checkout $head"
          Write-Host "parent   $parent"
          if ($parent -ne $env:S3_HEAD) { Write-Host "::error::the parent is not $env:S3_HEAD"; exit 1 }
          $changed = @(git diff --name-only HEAD^ HEAD)
          $changed | ForEach-Object { Write-Host "  changed by the CI commit: $_" }
          $outside = @($changed | Where-Object { $_ -notlike '.github/*' -and $_ -ne 'app/src/App/Live/LiveMesh.cpp' })
          if ($outside.Count -gt 0) { Write-Host "::error::the CI commit changes $($outside -join ', ')"; exit 1 }
          git diff HEAD^ HEAD -- app/src/App/Live/LiveMesh.cpp | Select-String -Pattern '^[+-][^+-]' | ForEach-Object { Write-Host "  LiveMesh.cpp (the CI endpoint): $($_.Line)" }

      - name: Put the CI stand-in exit label in (both variants)
        shell: pwsh
        run: |
          $path = 'app\src\App\Live\LiveMesh.cpp'
          $text = [IO.File]::ReadAllText($path)
          $old = '  if (route == Route::Direct) return "direct";' + "`n"
          $new = '  if (route == Route::Direct) return "URnetwork exit \u00B7 United States, Germany, Netherlands";  // CI STAND-IN (S3)' + "`n"
          $n = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($n -ne 1) { Write-Host "::error::the stand-in's anchor occurs $n times, not once"; exit 1 }
          [IO.File]::WriteAllText($path, $text.Replace($old, $new), (New-Object Text.UTF8Encoding($false)))
          git --no-pager diff -- $path | Select-String -Pattern 'CI STAND-IN|return "direct"' | ForEach-Object { Write-Host "  $($_.Line)" }

      - name: Remove the fix from the view (the control only)
        if: matrix.variant == 'control'
        shell: pwsh
        run: |
          $path = 'app\src\App\Views\StatusStripView.cpp'
          $text = [IO.File]::ReadAllText($path)
          $edits = @(
            @("    kit::SetPaneListRowFit(row, rowFit, value);`n", ''),
            @("  if (room <= 0) return;  // not laid out yet: its first SizeChanged fits it`n", "  if (room <= 0 || true) return;  // CONTROL: the fit removed`n")
          )
          foreach ($e in $edits) {
            $n = ([regex]::Matches($text, [regex]::Escape($e[0]))).Count
            if ($n -ne 1) { Write-Host "::error::the control's edit occurs $n times, not once: $($e[0])"; exit 1 }
            $text = $text.Replace($e[0], $e[1])
          }
          [IO.File]::WriteAllText($path, $text, (New-Object Text.UTF8Encoding($false)))
          git --no-pager diff --stat -- $path
          git --no-pager diff -- $path

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Check out the pinned commits
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File app\tools\build-sdk-dll.ps1 -Workspace "$env:RUNNER_TEMP\sdk" -CheckoutOnly
          exit $LASTEXITCODE

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/sdk/message/go.mod
          cache: false

      - name: Build the dll from the composition and stage it
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File app\tools\build-sdk-dll.ps1 -Workspace "$env:RUNNER_TEMP\sdk" -Stage
          exit $LASTEXITCODE

      - name: Build the app (Release x64, the dll required)
        shell: pwsh
        working-directory: app
        run: |
          $pin = '10.0.22621.0'
          $roots = @("${env:ProgramFiles(x86)}\Windows Kits\10", "$env:ProgramFiles\Windows Kits\10") | Where-Object { Test-Path -LiteralPath $_ }
          $usable = @(foreach ($r in $roots) {
            Get-ChildItem (Join-Path $r 'Include') -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' -and
                (Test-Path -LiteralPath (Join-Path $r "Include\$($_.Name)\um\windows.h")) -and
                (Test-Path -LiteralPath (Join-Path $r "Lib\$($_.Name)\um\x64\kernel32.lib")) } |
              Select-Object -ExpandProperty Name
          }) | Select-Object -Unique | Sort-Object { [version]$_ }
          $usable = @($usable)
          $sdk = if ($usable -contains $pin) { $pin } else { $usable[-1] }
          msbuild URmessage.sln /restore /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=$sdk /p:UrmRequireSdkDll=true /m /v:minimal /clp:Summary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item build\x64\Release\URmessage.exe, build\x64\Release\URnetworkSdk.dll | Format-Table Name, Length | Out-String | Write-Host

      - name: Check out message-server beside message, and build the rig
        shell: pwsh
        run: |
          $ws = Join-Path $env:RUNNER_TEMP 'sdk'
          $line = Get-Content (Join-Path $ws 'message\scripts\siblings.txt') | Where-Object { $_ -match '^message-server\s' } | Select-Object -First 1
          $parts = $line -split '\s+'
          Write-Host "message-server: $($parts[1]) $($parts[2])"
          git init -q (Join-Path $ws 'message-server')
          git -C (Join-Path $ws 'message-server') -c core.autocrlf=false fetch -q --depth 1 $parts[1] $parts[2]
          git -C (Join-Path $ws 'message-server') -c core.autocrlf=false checkout -q FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "message: $(git -C (Join-Path $ws 'message') rev-parse HEAD)"
          Copy-Item .github\task58\zz_task58_rig_test.go (Join-Path $ws 'message\sdk\cp3b\zz_task58_rig_test.go')
          $toolchain = (Select-String -Path (Join-Path $ws 'message\go.mod') -Pattern '^toolchain\s+(\S+)').Matches[0].Groups[1].Value
          $env:GOTOOLCHAIN = $toolchain
          $env:GOWORK = 'off'
          Write-Host "toolchain $toolchain"
          Push-Location (Join-Path $ws 'message\sdk\cp3b')
          go version
          go test -c -o (Join-Path $env:RUNNER_TEMP 'rig.exe') .
          $code = $LASTEXITCODE
          Pop-Location
          exit $code

      - name: Drive the app (s3exit, ${{ matrix.variant }})
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .github\task58\drive.ps1 -Leg s3exit `
            -Exe "$env:GITHUB_WORKSPACE\app\build\x64\Release\URmessage.exe" `
            -Rig "$env:RUNNER_TEMP\rig.exe" `
            -RigWorkDir "$env:RUNNER_TEMP\sdk\message\sdk\cp3b" `
            -Work "$env:RUNNER_TEMP\t58" `
            -Out "$env:GITHUB_WORKSPACE\t58out" | Tee-Object -FilePath "$env:RUNNER_TEMP\drive.out"
          $code = $LASTEXITCODE
          Set-Content -LiteralPath "$env:RUNNER_TEMP\drive.code" -Value $code
          Write-Host "the driver exited $code"
          exit 0

      - name: Judge (as-built passes every check; the control fails on the defect's)
        shell: powershell
        env:
          VARIANT: ${{ matrix.variant }}
          MUST: "exit-normal sweep 400: every strip item is drawn whole, inside the strip's edge|exit-advanced sweep 400: every strip item is drawn whole, inside the strip's edge"
        run: |
          $code = [int](Get-Content -LiteralPath "$env:RUNNER_TEMP\drive.code")
          $out = @(Get-Content -LiteralPath "$env:RUNNER_TEMP\drive.out")
          $fails = @($out | Where-Object { $_ -match '\] FAIL  ' })
          Write-Host "the driver exited $code, with $($fails.Count) FAIL line(s):"
          $fails | ForEach-Object { Write-Host "  $_" }
          if ($env:VARIANT -eq 'as-built') {
            if ($code -eq 0 -and $fails.Count -eq 0) { Write-Host 'as-built: every check passed'; exit 0 }
            Write-Host '::error::as-built: the driver did not pass every check'
            exit 1
          }
          $must = @($env:MUST -split '\|')
          $missing = @($must | Where-Object { $m = $_; @($fails | Where-Object { $_.Contains($m) }).Count -eq 0 })
          if ($code -ne 0 -and $missing.Count -eq 0) { Write-Host "control KILLED by the s3exit leg: $($must -join ' AND ')"; exit 0 }
          Write-Host "::error::control SURVIVED: the driver exited $code, and these checks did not FAIL: $($missing -join ' AND ')"
          exit 1

      - name: Upload the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3exit-${{ matrix.variant }}
          path: t58out/
          if-no-files-found: warn
