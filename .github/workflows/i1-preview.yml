# THROWAWAY, NEVER MERGE, NEVER IN AN UPSTREAM PULL REQUEST. Identity phase 1, Task 6 Step 4: the
# preview zip of the identity screens, built as shipped and smoked the README's way.
#
#   package  builds the identity preview (/p:UrmIdentityPreview=true) OVER A STAGED DLL AND A
#            LEFTOVER ONE: a stand-in URnetworkSdk.dll is staged where the standard build copies it
#            from, and another sits in the output folder as a standard build leaves it, and neither
#            may be in the preview's output. Then --diagnose three times: with the preview's own
#            override variable, with the REAL app's (URMESSAGE_APP_ROOT, which the preview must not
#            follow: it must resolve its own folder and write nothing there), and as shipped with
#            neither. Then the MSI is asked for, from this output and with /p:UrmIdentityPreview=true,
#            and must be refused both times. Then .github/i1/preview-package.ps1
#            makes URmessage-identity-preview/ (the build output less the by-products the MSI
#            leaves out, plus READ-ME-FIRST.txt), zips it as URmessage-identity-preview-slice0.zip and
#            holds the zip to the folder both ways.
#   smoke    on windows-2022 and windows-2025: the zip extracted to a fresh folder, no
#            %LOCALAPPDATA%\URmessage-identity-preview and no %LOCALAPPDATA%\URmessage, no
#            URMESSAGE_* variable, no credential, URmessage.exe started with no arguments; it must
#            open in the fabricated mode on "Set up this device" (.github/i1/preview-smoke.ps1).
# The checkout is the tested head plus CI files only (the first step proves it). Nothing is
# published: no release, no tag. The zip is an artifact.
name: I1 identity preview zip (throwaway)

on:
  push:
    branches:
      - 'ci/i1-preview**'

permissions:
  contents: read

env:
  I1_HEAD: bcb81909017f3f6626b3276e401497deb8e48434

jobs:
  package:
    name: Build the identity preview zip (x64)
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      zip_sha256: ${{ steps.assemble.outputs.zip_sha256 }}
      exe_sha256: ${{ steps.assemble.outputs.exe_sha256 }}
      readme_sha256: ${{ steps.assemble.outputs.readme_sha256 }}
      entries: ${{ steps.assemble.outputs.entries }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove the checkout is the tested head plus CI files only
        shell: pwsh
        run: |
          Write-Host "checkout $(git rev-parse HEAD)"
          Write-Host "tested   $(git rev-parse HEAD^)"
          if ((git rev-parse HEAD^) -ne $env:I1_HEAD) { Write-Host "::error::the tested head is not $env:I1_HEAD"; exit 1 }
          $changed = @(git diff --name-only HEAD^ HEAD)
          $changed | ForEach-Object { Write-Host "  added by the CI commit: $_" }
          $outside = @($changed | Where-Object { $_ -notlike '.github/*' })
          if ($outside.Count -gt 0) { Write-Host "::error::the CI commit changes files outside .github: $($outside -join ', ')"; exit 1 }

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build the identity preview (Release x64, no SDK)
        shell: pwsh
        working-directory: app
        run: |
          $pin = '10.0.22621.0'
          $roots = @("${env:ProgramFiles(x86)}\Windows Kits\10", "$env:ProgramFiles\Windows Kits\10") | Where-Object { Test-Path -LiteralPath $_ }
          $usable = @(foreach ($r in $roots) {
            Get-ChildItem (Join-Path $r 'Include') -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^10\.0\.\d+\.\d+$' -and
                (Test-Path -LiteralPath (Join-Path $r "Include\$($_.Name)\um\windows.h")) -and
                (Test-Path -LiteralPath (Join-Path $r "Lib\$($_.Name)\um\x64\kernel32.lib")) } |
              Select-Object -ExpandProperty Name
          }) | Select-Object -Unique | Sort-Object { [version]$_ }
          $usable = @($usable)
          $sdk = if ($usable -contains $pin) { $pin } else { $usable[-1] }
          # THE TWO WAYS A DLL COULD RIDE ALONG (the review's should-fix 3): one staged where the
          # standard build copies it from, and one left in the output by a standard build. Both are
          # stand-ins, a few bytes of text: nothing loads them, and the preview must carry neither.
          $staged = 'third_party\urnetwork-sdk\bin\x64\URnetworkSdk.dll'
          $leftover = 'build\x64\Release\URnetworkSdk.dll'
          if (Test-Path -LiteralPath $staged) { Write-Host '::error::a real SDK dll is staged on this runner'; exit 1 }
          New-Item -ItemType Directory -Force (Split-Path -Parent $staged), (Split-Path -Parent $leftover) | Out-Null
          Set-Content -LiteralPath $staged -Value 'stand-in: staged' -Encoding ascii
          Set-Content -LiteralPath $leftover -Value 'stand-in: left by a standard build' -Encoding ascii
          Write-Host "stand-ins: $staged ($((Get-Item $staged).Length) bytes), $leftover ($((Get-Item $leftover).Length) bytes)"
          msbuild URmessage.sln /restore /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=$sdk /p:UrmIdentityPreview=true /m /v:minimal /clp:Summary
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item build\x64\Release\URmessage.exe | Format-Table Name, Length | Out-String | Write-Host
          $bad = 0
          if (Test-Path -LiteralPath $leftover) { Write-Host '::error::the preview output holds URnetworkSdk.dll'; $bad++ } else { Write-Host 'PASS  the preview output holds no URnetworkSdk.dll: the staged one was not copied, and the leftover was removed' }
          $marker = 'build\x64\Release\IDENTITY-PREVIEW-BUILD.txt'
          if (Test-Path -LiteralPath $marker) { Write-Host "PASS  the preview output says what it is: $(Get-Content -LiteralPath $marker -Raw)" } else { Write-Host '::error::the preview output has no IDENTITY-PREVIEW-BUILD.txt'; $bad++ }
          Remove-Item -LiteralPath $staged
          if ($bad -gt 0) { exit 1 }

      - name: Run --diagnose on the built exe, three times
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'app\build\x64\Release'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $previewVar = 'URMESSAGE_IDENTITY_PREVIEW_APP_ROOT'
          $realVar = 'URMESSAGE_APP_ROOT'
          function Diagnose([string]$label, [string]$var, [string]$root) {
            $psi = [System.Diagnostics.ProcessStartInfo]::new((Join-Path $dir 'URmessage.exe'))
            $psi.Arguments = '--diagnose'
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            $psi.RedirectStandardOutput = $true
            $psi.RedirectStandardError = $true
            $psi.StandardOutputEncoding = [System.Text.Encoding]::UTF8
            $psi.StandardErrorEncoding = [System.Text.Encoding]::UTF8
            foreach ($v in @($previewVar, $realVar)) { if ($psi.EnvironmentVariables.ContainsKey($v)) { $psi.EnvironmentVariables.Remove($v) } }
            if ($var -ne '') { $psi.EnvironmentVariables[$var] = $root }
            $p = [System.Diagnostics.Process]::Start($psi)
            $outTask = $p.StandardOutput.ReadToEndAsync()
            $errTask = $p.StandardError.ReadToEndAsync()
            if (-not $p.WaitForExit(120000)) { try { $p.Kill() } catch { }; Write-Host '::error::--diagnose did not exit'; exit 1 }
            $out = $outTask.GetAwaiter().GetResult()
            $null = $errTask.GetAwaiter().GetResult()
            Set-Content -LiteralPath "evidence\diagnose-$label.out" -Value $out -Encoding utf8 -NoNewline
            return @($out -split "`r?`n")
          }
          $bad = 0
          function Judge([string]$label, [string[]]$lines, [string[]]$wants) {
            $fails = @($lines | Where-Object { $_ -match '\bFAIL\b' })
            $passes = @($lines | Where-Object { $_ -match '\bPASS\b' })
            Write-Host "diagnose ($label): $($lines.Count) lines, $($passes.Count) PASS, $($fails.Count) FAIL"
            $fails | ForEach-Object { Write-Host "::error::$_" }
            $kind = @($lines | Where-Object { $_ -match '^\s+build kind\s+:' })
            @($lines | Where-Object { $_ -match '^\s+(build kind|storage root|single-inst key)\s+:' }) | ForEach-Object { Write-Host "  ($label) $($_.Trim())" }
            $ok = $fails.Count -eq 0 -and $kind.Count -eq 1
            foreach ($w in $wants) {
              $has = $kind.Count -eq 1 -and $kind[0].Contains($w)
              Write-Host "  ($label) the build kind line says '$w': $has"
              $ok = $ok -and $has
            }
            if (-not $ok) { $script:bad++ }
          }
          $common = @('PASS  identity preview (slice 0)', 'Common compiled as the preview build', "override variable $previewVar")
          # 1. the preview's own override variable: followed
          $own = Join-Path $env:RUNNER_TEMP 'preview-root'
          Judge 'preview-var' (Diagnose 'preview-var' $previewVar $own) ($common + @("the root is overridden by $previewVar"))
          # 2. THE REAL APP'S VARIABLE (the review's should-fix 4): every agent worktree and CI job sets
          # it, and the preview must not follow it - its own folder, and nothing written to that root
          $real = Join-Path $env:RUNNER_TEMP 'real-app-root'
          Judge 'real-var' (Diagnose 'real-var' $realVar $real) ($common + @("Common's StorageRoot resolved it"))
          if (Test-Path -LiteralPath $real) { Write-Host "::error::the preview wrote into $realVar's root, $real"; $bad++ } else { Write-Host "PASS  with $realVar set, the preview wrote nothing to $real" }
          # 3. as shipped, neither variable
          Judge 'as-shipped' (Diagnose 'as-shipped' '' '') ($common + @("Common's StorageRoot resolved it"))
          if ($bad -gt 0) { exit 1 }

      - name: Ask for the MSI from the preview, which must be refused
        shell: pwsh
        working-directory: app
        run: |
          # the review's nit 6b: the MSI installs whatever is in the output folder, and would carry
          # the preview exe under the standard build's user model id
          $bad = 0
          foreach ($case in @(
              @{ label = 'from the preview output'; args = @(); want = 'holds the identity preview build' },
              @{ label = 'with /p:UrmIdentityPreview=true'; args = @('/p:UrmIdentityPreview=true'); want = 'The MSI is never built from the identity preview' })) {
            $log = Join-Path $env:RUNNER_TEMP ('msi-' + [guid]::NewGuid().ToString('N').Substring(0, 6) + '.log')
            $out = & msbuild installer\Installer.wixproj /restore /p:Configuration=Release /p:Platform=x64 "/p:BinDir=$env:GITHUB_WORKSPACE\app\build\x64\Release" @($case.args) /v:minimal /nologo 2>&1 | Out-String
            $code = $LASTEXITCODE
            $refused = $code -ne 0 -and $out.Contains($case.want)
            Write-Host "the MSI $($case.label): exit $code; refused for its own reason: $refused"
            Write-Host ($out.Trim() -split "`r?`n" | Select-Object -Last 6 | Out-String)
            if (-not $refused) { Write-Host "::error::the MSI was not refused $($case.label)"; $bad++ }
          }
          $msi = @(Get-ChildItem -Recurse -Filter *.msi -Path installer -ErrorAction SilentlyContinue)
          if ($msi.Count -gt 0) { Write-Host "::error::an MSI was made: $($msi.FullName -join ', ')"; $bad++ } else { Write-Host 'PASS  no MSI was made' }
          if ($bad -gt 0) { exit 1 }
          # the refused msbuild left LASTEXITCODE at 1, and the runner would end the step with it
          exit 0

      - name: Assemble, zip and check the preview
        id: assemble
        shell: pwsh
        run: |
          & .github\i1\preview-package.ps1 -Out "$env:RUNNER_TEMP\pkg" -Evidence evidence
          exit $LASTEXITCODE

      - name: Upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: URmessage-identity-preview-slice0
          path: ${{ runner.temp }}/pkg/URmessage-identity-preview-slice0.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-preview-evidence
          path: evidence/
          if-no-files-found: warn

  smoke:
    name: Smoke the preview as shipped (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove the checkout is the tested head plus CI files only
        shell: pwsh
        run: |
          Write-Host "checkout $(git rev-parse HEAD)"
          Write-Host "tested   $(git rev-parse HEAD^)"
          if ((git rev-parse HEAD^) -ne $env:I1_HEAD) { Write-Host "::error::the tested head is not $env:I1_HEAD"; exit 1 }
          $outside = @(git diff --name-only HEAD^ HEAD | Where-Object { $_ -notlike '.github/*' })
          if ($outside.Count -gt 0) { Write-Host "::error::the CI commit changes files outside .github"; exit 1 }

      - name: Download the zip
        uses: actions/download-artifact@v4
        with:
          name: URmessage-identity-preview-slice0
          path: ${{ runner.temp }}/dl

      - name: Extract it to a fresh folder
        shell: pwsh
        env:
          ZIP_SHA256: ${{ needs.package.outputs.zip_sha256 }}
          EXE_SHA256: ${{ needs.package.outputs.exe_sha256 }}
          README_SHA256: ${{ needs.package.outputs.readme_sha256 }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'dl\URmessage-identity-preview-slice0.zip'
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          Write-Host "zip $sha"
          if ($sha -ne $env:ZIP_SHA256) { Write-Host "::error::the downloaded zip is not the one the package job made ($env:ZIP_SHA256)"; exit 1 }
          $fresh = Join-Path $env:RUNNER_TEMP ('fresh-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fresh | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $fresh
          $top = @(Get-ChildItem -LiteralPath $fresh -Force)
          Write-Host "the zip extracts to: $($top.Name -join ', ')"
          if ($top.Count -ne 1 -or $top[0].Name -ne 'URmessage-identity-preview') { Write-Host '::error::the zip does not extract to one folder, URmessage-identity-preview'; exit 1 }
          $dir = Join-Path $fresh 'URmessage-identity-preview'
          foreach ($pair in @(@('URmessage.exe', $env:EXE_SHA256), @('READ-ME-FIRST.txt', $env:README_SHA256))) {
            $h = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $dir $pair[0])).Hash.ToLowerInvariant()
            Write-Host "$($pair[0]) $h"
            if ($h -ne $pair[1]) { Write-Host "::error::$($pair[0]) is not the packaged one"; exit 1 }
          }
          Write-Host "extracted: $(@(Get-ChildItem -LiteralPath $dir -Recurse -File).Count) files under $dir"
          "PACKAGE_DIR=$dir" >> $env:GITHUB_ENV

      - name: Run it as shipped, and capture the window
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File .github\i1\preview-smoke.ps1 -Dir "$env:PACKAGE_DIR" -Out "$env:GITHUB_WORKSPACE\smoke" -Os '${{ matrix.os }}'
          exit $LASTEXITCODE

      - name: Upload the capture and the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i1-preview-smoke-${{ matrix.os }}
          path: smoke/
          if-no-files-found: warn
